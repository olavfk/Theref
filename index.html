<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>THE REF</title>

<meta name="theme-color" content="#0a0f0a">
<link rel="icon" href="data:,">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root{
  --bg:#0a0f0a;
  --card:#121712;
  --card-2:#181f18;
  --border:#273127;
  --text:#f3f6f2;
  --muted:#8b978a;
  --accent:#a3e635;

  --green:#22c55e;
  --blue:#38bdf8;
  --yellow:#facc15;
  --red:#f43f5e;
}

html,
body{
  background:
    radial-gradient(circle at top, #162014 0%, #0a0f0a 45%),
    #0a0f0a;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  font-family:'Inter',sans-serif;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.35;
  pointer-events:none;
}

.wrapper{
  position:relative;
  z-index:1;
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:20px 16px 80px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.logo{
  font-family:'Bebas Neue',cursive;
  font-size:40px;
  letter-spacing:3px;
  line-height:1;
}

.logo span{
  display:block;
  margin-top:2px;
  font-size:12px;
  letter-spacing:3px;
  opacity:.45;
  font-family:'Barlow Condensed',sans-serif;
}

.streak{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}

.streak-fire{
  font-size:24px;
}

.streak-count{
  font-family:'Bebas Neue',cursive;
  font-size:24px;
  line-height:1;
  color:#fb923c;
}

.streak-label{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
}

/* PROGRESS */

.progress{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.progress-pip{
  flex:1;
  height:6px;
  border-radius:999px;
  background:#202820;
  overflow:hidden;
  position:relative;
}

.progress-pip.active::after{
  content:'';
  position:absolute;
  inset:0;
  background:var(--accent);
  animation:pulse 1.4s infinite;
}

.progress-pip.correct{
  background:var(--green);
}

.progress-pip.wrong{
  background:var(--red);
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

/* VIDEO */

.video-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:20px;
  background:#000;
  border:1px solid #1f271f;
  box-shadow:0 20px 80px rgba(0,0,0,.55);
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  display:block;
  opacity:0;
  transition:opacity .35s ease;
}

video.ready{
  opacity:1;
}

.video-top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:14px;
  background:linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
  z-index:2;
}

.clip-label{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#ffffffcc;
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
}

/* INFO */

.clip-info{
  margin:18px 0 12px;
}

.clip-number{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:4px;
}

.clip-title{
  font-size:24px;
  font-weight:700;
  line-height:1.15;
}

/* HINT */

.hint{
  text-align:center;
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#9ca3af;
  margin:14px 0;
  min-height:18px;
}

/* ANSWERS */

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:8px;
}

.answer{
  position:relative;
  padding:22px 14px;
  border-radius:18px;
  border:1px solid #2d3a2c;
  background:linear-gradient(to bottom, #1b241a, #141a13);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
  transition:
    transform .15s ease,
    border-color .2s ease,
    background .2s ease,
    opacity .2s ease;
}

.answer:hover:not(:disabled):not(.locked){
  transform:translateY(-3px);
  border-color:#84cc16;
  background:linear-gradient(to bottom, #212b1f, #171d16);
}

.answer:disabled{
  cursor:not-allowed;
}

.answer.locked{
  opacity:.35;
}

.answer.correct-selected{
  border-color:var(--green)!important;
  background:#14532d!important;
}

.answer.wrong-selected{
  border-color:var(--red)!important;
  background:#450a0a!important;
}

.answer.reveal{
  border-color:var(--green)!important;
  background:#14532d55!important;
}

.answer-icon{
  font-size:30px;
}

.answer-label{
  font-family:'Bebas Neue',cursive;
  letter-spacing:1.5px;
  font-size:18px;
}

.answer.none .answer-label{
  color:var(--green);
}

.answer.freekick .answer-label{
  color:var(--blue);
}

.answer.yellow .answer-label{
  color:var(--yellow);
}

.answer.red .answer-label{
  color:var(--red);
}

/* RESULT */

.result{
  display:none;
  margin-top:16px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  animation:up .25s ease;
}

@keyframes up{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.result-top{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.result-title{
  font-family:'Bebas Neue',cursive;
  letter-spacing:2px;
  font-size:24px;
}

.result-title.correct{
  color:var(--green);
}

.result-title.wrong{
  color:var(--red);
}

.result-tag{
  margin-left:auto;
  padding:4px 8px;
  border-radius:6px;
  background:#ffffff12;
  font-size:12px;
  letter-spacing:1px;
  font-weight:700;
}

.result-text{
  color:#a8b5a7;
  line-height:1.7;
  font-size:14px;
}

/* BUTTON */

.next{
  width:100%;
  margin-top:16px;
  padding:16px;
  border:none;
  border-radius:18px;
  background:var(--accent);
  color:#0a0f0a;
  font-family:'Bebas Neue',cursive;
  font-size:22px;
  letter-spacing:3px;
  cursor:pointer;
  display:none;
  transition:transform .15s ease;
}

.next:hover{
  transform:translateY(-2px);
}

.next.visible{
  display:block;
}

/* END */

.done{
  display:none;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:22px;
  padding-top:40px;
}

.done.visible{
  display:flex;
}

.done-emoji{
  font-size:70px;
}

.done-title{
  font-family:'Bebas Neue',cursive;
  font-size:54px;
  letter-spacing:4px;
}

.done-score{
  font-size:18px;
  color:var(--muted);
}

.done-score strong{
  color:var(--text);
  font-size:34px;
}

.score-row{
  display:flex;
  gap:10px;
}

.score-box{
  width:38px;
  height:38px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.score-box.correct{
  background:#14532d;
  border:1px solid var(--green);
}

.score-box.wrong{
  background:#450a0a;
  border:1px solid var(--red);
}

.countdown-box{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.countdown-label{
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
}

.countdown{
  font-family:'Bebas Neue',cursive;
  font-size:42px;
  letter-spacing:4px;
}

.share{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  cursor:pointer;
  font-family:'Bebas Neue',cursive;
  font-size:20px;
  letter-spacing:3px;
}

.share:hover{
  border-color:var(--accent);
  color:var(--accent);
}

.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translateX(-50%) translateY(16px);
  background:var(--accent);
  color:#0a0f0a;
  padding:10px 20px;
  border-radius:10px;
  font-size:13px;
  letter-spacing:2px;
  font-weight:700;
  opacity:0;
  transition:.3s ease;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.no-clips{
  margin-top:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:32px;
  text-align:center;
}

.no-clips h2{
  font-family:'Bebas Neue',cursive;
  letter-spacing:2px;
  font-size:34px;
  margin-bottom:10px;
}

.no-clips p{
  color:var(--muted);
  line-height:1.7;
}
</style>
</head>

<body>

<div class="wrapper">

  <header class="header">
    <div class="logo">
      THE REF
      <span>DAILY FOOTBALL DECISIONS</span>
    </div>

    <div class="streak">
      <div class="streak-fire">🔥</div>
      <div class="streak-count" id="streakCount">0</div>
      <div class="streak-label">Streak</div>
    </div>
  </header>

  <div id="game">

    <div class="progress" id="progress"></div>

    <div class="video-wrap">
      <div class="video-top">
        <div class="clip-label" id="clipLabel">Clip 1</div>
      </div>

      <video
        id="video"
        playsinline
        webkit-playsinline
        controls
      ></video>
    </div>

    <div class="clip-info">
      <div class="clip-number" id="clipNumber">Incident 1</div>
      <div class="clip-title" id="clipTitle">Loading...</div>
    </div>

    <div class="hint" id="hint">
      Watch the clip
    </div>

    <div class="answers">

      <button class="answer none locked" data-answer="none">
        <div class="answer-icon">✅</div>
        <div class="answer-label">No Foul</div>
      </button>

      <button class="answer freekick locked" data-answer="freekick">
        <div class="answer-icon">⚽</div>
        <div class="answer-label">Free Kick</div>
      </button>

      <button class="answer yellow locked" data-answer="yellow">
        <div class="answer-icon">🟨</div>
        <div class="answer-label">Yellow</div>
      </button>

      <button class="answer red locked" data-answer="red">
        <div class="answer-icon">🟥</div>
        <div class="answer-label">Red Card</div>
      </button>

    </div>

    <div class="result" id="result"></div>

    <button class="next" id="nextButton">
      NEXT →
    </button>

  </div>

  <div class="done" id="done">

    <div class="done-emoji" id="doneEmoji">🏆</div>

    <div class="done-title">
      FULL TIME
    </div>

    <div class="done-score">
      You scored <strong id="finalScore">0/3</strong>
    </div>

    <div class="score-row" id="scoreRow"></div>

    <div class="countdown-box">
      <div class="countdown-label">
        Next clips in
      </div>

      <div class="countdown" id="countdown">
        00:00:00
      </div>
    </div>

    <button class="share" id="shareButton">
      SHARE RESULT
    </button>

  </div>

</div>

<div class="toast" id="toast">
  COPIED
</div>

<script>
const ANSWER_MAP = {
  n:'none',
  f:'freekick',
  y:'yellow',
  r:'red'
};

const ANSWER_LABELS = {
  none:'No Foul ✅',
  freekick:'Free Kick ⚽',
  yellow:'Yellow Card 🟨',
  red:'Red Card 🟥'
};

const DEFAULT_EXPLANATIONS = {
  none:'No foul. Play continues.',
  freekick:'A foul was committed. Free kick awarded.',
  yellow:'Reckless challenge. Yellow card.',
  red:'Serious foul play. Red card.'
};

const CLIP_META = {
  '080526-1':{
    title:'Dangerous Tackle',
    explanation:'Studs up with excessive force. Clear red card.'
  },
  '080526-2':{
    title:'Late Challenge',
    explanation:'Late and reckless. Yellow card is correct.'
  },
  '080526-3':{
    title:'Shoulder Duel',
    explanation:'Fair physical contact. No foul.'
  }
};

function getTodayCode(){
  const d = new Date();

  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = String(d.getFullYear()).slice(-2);

  return `${dd}${mm}${yy}`;
}

function getTodayISO(){
  return new Date().toISOString().split('T')[0];
}

async function exists(url){
  try{
    const r = await fetch(url,{method:'HEAD'});
    return r.ok;
  }catch{
    return false;
  }
}

async function buildClips(code){

  const clips = [];

  for(let i=1;i<=3;i++){

    for(const c of ['n','f','y','r']){

      const filename = `${code}/${code}-${i}-${c}.mp4`;

      const ok = await exists(filename);

      if(ok){

        const key = `${code}-${i}`;
        const meta = CLIP_META[key] || {};

        clips.push({
          filename,
          correct:ANSWER_MAP[c],
          title:meta.title || `Incident ${i}`,
          explanation:meta.explanation || DEFAULT_EXPLANATIONS[ANSWER_MAP[c]]
        });

        break;
      }
    }
  }

  return clips;
}

const TODAY_CODE = getTodayCode();
const TODAY_ISO = getTodayISO();

let clips = [];

let state = {
  clipIndex:0,
  answers:[],
  done:false,
  date:TODAY_ISO
};

let streak = {
  count:0,
  lastDate:null
};

function loadStorage(){

  try{

    const s = JSON.parse(localStorage.getItem('theref_state'));

    if(s && s.date === TODAY_ISO){
      state = s;
    }

    const st = JSON.parse(localStorage.getItem('theref_streak'));

    if(st){
      streak = st;
    }

  }catch(e){}
}

function saveState(){
  localStorage.setItem('theref_state',JSON.stringify(state));
}

function saveStreak(){
  localStorage.setItem('theref_streak',JSON.stringify(streak));
}

function buildProgress(){

  const row = document.getElementById('progress');

  row.innerHTML = '';

  clips.forEach((_,i)=>{

    const el = document.createElement('div');

    el.className = 'progress-pip';

    if(i < state.answers.length){
      el.classList.add(
        state.answers[i].correct ? 'correct' : 'wrong'
      );
    }else if(i === state.clipIndex){
      el.classList.add('active');
    }

    row.appendChild(el);
  });
}

let answered = false;

function loadClip(index){

  answered = false;

  const clip = clips[index];

  const video = document.getElementById('video');

  video.classList.remove('ready');

  document.getElementById('clipLabel').textContent =
    `Clip ${index+1} of ${clips.length}`;

  document.getElementById('clipNumber').textContent =
    `Incident ${index+1}`;

  document.getElementById('clipTitle').textContent =
    clip.title;

  document.getElementById('hint').textContent =
    'Watch the clip';

  document.getElementById('result').style.display = 'none';

  document.getElementById('nextButton').classList.remove('visible');

  document.querySelectorAll('.answer').forEach(btn=>{

    btn.classList.add('locked');

    btn.disabled = false;

    btn.classList.remove(
      'correct-selected',
      'wrong-selected',
      'reveal'
    );
  });

  buildProgress();

  video.src = clip.filename;

  video.load();

  video.oncanplay = ()=>{
    video.classList.add('ready');
  };

  video.onended = ()=>{

    if(answered) return;

    document.querySelectorAll('.answer').forEach(btn=>{
      btn.classList.remove('locked');
    });

    document.getElementById('hint').textContent =
      'Choose your decision';
  };

  video.play().catch(()=>{
    document.getElementById('hint').textContent =
      'Tap play';
  });

  const next = clips[index+1];

  if(next){

    const preload = document.createElement('link');

    preload.rel = 'preload';
    preload.as = 'video';
    preload.href = next.filename;

    document.head.appendChild(preload);
  }
}

function submitAnswer(choice){

  const btn = document.querySelector(
    `[data-answer="${choice}"]`
  );

  if(btn.classList.contains('locked')) return;

  if(answered) return;

  answered = true;

  const clip = clips[state.clipIndex];

  const correct = choice === clip.correct;

  state.answers.push({
    chosen:choice,
    correct
  });

  saveState();

  document.querySelectorAll('.answer').forEach(el=>{

    el.disabled = true;

    const id = el.dataset.answer;

    if(id === choice && correct){
      el.classList.add('correct-selected');
    }

    if(id === choice && !correct){
      el.classList.add('wrong-selected');
    }

    if(id === clip.correct && !correct){
      el.classList.add('reveal');
    }
  });

  buildProgress();

  const result = document.getElementById('result');

  result.style.display = 'block';

  result.innerHTML = `
    <div class="result-top">
      <div style="font-size:22px">
        ${correct ? '✅' : '❌'}
      </div>

      <div class="result-title ${correct ? 'correct' : 'wrong'}">
        ${correct ? 'Correct' : 'Wrong Call'}
      </div>

      <div class="result-tag">
        ${ANSWER_LABELS[clip.correct]}
      </div>
    </div>

    <div class="result-text">
      ${clip.explanation}
    </div>
  `;

  const nextButton = document.getElementById('nextButton');

  nextButton.classList.add('visible');

  nextButton.textContent =
    state.clipIndex >= clips.length - 1
      ? 'SEE RESULTS →'
      : 'NEXT →';
}

function nextClip(){

  if(state.clipIndex >= clips.length - 1){
    finishGame();
    return;
  }

  state.clipIndex++;

  loadClip(state.clipIndex);
}

function finishGame(){

  state.done = true;

  saveState();

  const yesterday = new Date(
    Date.now()-86400000
  ).toISOString().split('T')[0];

  if(streak.lastDate === yesterday){
    streak.count++;
  }else if(streak.lastDate !== TODAY_ISO){
    streak.count = 1;
  }

  streak.lastDate = TODAY_ISO;

  saveStreak();

  document.getElementById('streakCount').textContent =
    streak.count;

  document.getElementById('game').style.display = 'none';

  document.getElementById('done').classList.add('visible');

  const score = state.answers.filter(a=>a.correct).length;

  document.getElementById('finalScore').textContent =
    `${score}/${clips.length}`;

  const emoji =
    score === 3 ? '🏆' :
    score === 2 ? '👏' :
    score === 1 ? '😬' :
    '💀';

  document.getElementById('doneEmoji').textContent = emoji;

  document.getElementById('scoreRow').innerHTML =
    state.answers.map(a=>`
      <div class="score-box ${a.correct ? 'correct' : 'wrong'}">
        ${a.correct ? '✅' : '❌'}
      </div>
    `).join('');

  startCountdown();
}

function startCountdown(){

  function tick(){

    const now = new Date();

    const midnight = new Date(now);

    midnight.setHours(24,0,0,0);

    const diff = midnight - now;

    const h = String(Math.floor(diff/3600000)).padStart(2,'0');
    const m = String(Math.floor(diff%3600000/60000)).padStart(2,'0');
    const s = String(Math.floor(diff%60000/1000)).padStart(2,'0');

    document.getElementById('countdown').textContent =
      `${h}:${m}:${s}`;
  }

  tick();

  setInterval(tick,1000);
}

function shareResult(){

  const score = state.answers.filter(a=>a.correct).length;

  const pips = state.answers.map(a=>
    a.correct ? '🟩' : '🟥'
  ).join('');

  const text = `THE REF ${TODAY_ISO}

${pips}
${score}/${clips.length}

🔥 ${streak.count} day streak`;

  navigator.clipboard.writeText(text).then(()=>{

    const toast = document.getElementById('toast');

    toast.classList.add('show');

    setTimeout(()=>{
      toast.classList.remove('show');
    },2000);
  });
}

document
  .querySelectorAll('.answer')
  .forEach(btn=>{

    btn.addEventListener('click',()=>{

      submitAnswer(
        btn.dataset.answer
      );
    });
  });

document
  .getElementById('nextButton')
  .addEventListener('click',nextClip);

document
  .getElementById('shareButton')
  .addEventListener('click',shareResult);

async function init(){

  loadStorage();

  document.getElementById('streakCount').textContent =
    streak.count;

  if(state.done){

    document.getElementById('game').style.display =
      'none';

    document.getElementById('done').classList.add('visible');

    const score = state.answers.filter(a=>a.correct).length;

    document.getElementById('finalScore').textContent =
      `${score}/${state.answers.length}`;

    startCountdown();

    return;
  }

  document.getElementById('hint').textContent =
    'Loading clips...';

  clips = await buildClips(TODAY_CODE);

  if(clips.length === 0){

    document.getElementById('game').innerHTML = `
      <div class="no-clips">
        <h2>No clips found</h2>

        <p>
          Create a folder named:
          <br><br>
          <strong>${TODAY_CODE}</strong>
          <br><br>
          Then add:
          <br><br>
          ${TODAY_CODE}-1-r.mp4<br>
          ${TODAY_CODE}-2-y.mp4<br>
          ${TODAY_CODE}-3-f.mp4
        </p>
      </div>
    `;

    return;
  }

  buildProgress();

  loadClip(state.clipIndex);
}

init();
</script>
