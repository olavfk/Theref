<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>THE REF</title>
<meta name="theme-color" content="#0a0f0a"/>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0f0a;
  --card:#121712;
  --card2:#181f18;
  --border:#273127;
  --text:#f3f6f2;
  --muted:#8b978a;
  --accent:#a3e635;
  --green:#22c55e;
  --blue:#38bdf8;
  --yellow:#facc15;
  --red:#f43f5e;
}

html,body{
  background:radial-gradient(circle at top,#162014 0%,#0a0f0a 45%),#0a0f0a;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.35;pointer-events:none;z-index:0;
}

.wrapper{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;padding:20px 16px 80px;}

/* ── AUTH SCREEN ── */
#authScreen{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:100vh;gap:0;
  padding:40px 20px;
}

.auth-logo{
  font-family:'Bebas Neue',cursive;font-size:56px;letter-spacing:4px;
  color:var(--accent);text-shadow:0 0 40px #a3e63540;line-height:1;
  margin-bottom:6px;
}

.auth-sub{
  font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);margin-bottom:40px;
}

.auth-card{
  width:100%;max-width:380px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px;
  display:flex;flex-direction:column;gap:14px;
}

.auth-title{
  font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:2px;
  color:var(--text);margin-bottom:4px;text-align:center;
}

.auth-toggle{
  text-align:center;font-size:13px;color:var(--muted);margin-bottom:4px;
}

.auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600;}
.auth-toggle a:hover{text-decoration:underline;}

.input-group{display:flex;flex-direction:column;gap:6px;}

.input-label{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}

.input-field{
  background:#0d130d;border:1.5px solid var(--border);
  border-radius:12px;padding:13px 16px;
  font-size:15px;color:var(--text);font-family:'Inter',sans-serif;
  outline:none;transition:border-color .2s;width:100%;
}

.input-field:focus{border-color:var(--accent);}
.input-field::placeholder{color:#3a4a39;}

.btn-primary{
  width:100%;padding:14px;border:none;border-radius:14px;
  background:var(--accent);color:#0a0f0a;
  font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:2px;
  cursor:pointer;transition:transform .15s,background .15s;
}
.btn-primary:hover{background:#b5f040;transform:translateY(-1px);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

.divider{
  display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

.btn-google{
  width:100%;padding:13px;border:1.5px solid var(--border);
  border-radius:14px;background:transparent;color:var(--text);
  font-size:15px;font-weight:600;font-family:'Inter',sans-serif;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:border-color .2s,background .2s;
}
.btn-google:hover{border-color:#6b7a6a;background:#0d130d;}

.google-icon{width:20px;height:20px;}

.auth-error{
  background:#450a0a;border:1px solid var(--red);
  border-radius:10px;padding:10px 14px;
  font-size:13px;color:#fca5a5;display:none;
}

.auth-error.show{display:block;}

/* ── LOADING ── */
#loadingScreen{
  display:none;flex-direction:column;align-items:center;
  justify-content:center;min-height:100vh;gap:16px;
}

#loadingScreen.show{display:flex;}

.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.loading-text{font-size:13px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}

/* ── HEADER ── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;padding-top:4px;
}

.logo{font-family:'Bebas Neue',cursive;font-size:40px;letter-spacing:3px;line-height:1;}
.logo span{display:block;margin-top:2px;font-size:12px;letter-spacing:3px;opacity:.45;font-family:'Barlow Condensed',sans-serif;}

.header-right{display:flex;align-items:center;gap:12px;}

.streak{display:flex;flex-direction:column;align-items:center;gap:1px;}
.streak-fire{font-size:22px;}
.streak-count{font-family:'Bebas Neue',cursive;font-size:24px;line-height:1;color:#fb923c;}
.streak-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

.user-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;transition:border-color .2s;
  flex-shrink:0;
}
.user-btn:hover{border-color:var(--muted);}

/* User menu */
.user-menu{
  position:fixed;top:0;right:0;bottom:0;left:0;
  z-index:50;display:none;
}
.user-menu.show{display:block;}
.user-menu-backdrop{position:absolute;inset:0;}
.user-menu-card{
  position:absolute;top:68px;right:20px;
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:8px;min-width:220px;
  box-shadow:0 20px 60px #00000080;
}
.user-menu-email{padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:4px;}
.user-menu-item{
  padding:11px 14px;border-radius:10px;font-size:14px;font-weight:500;
  cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:10px;
}
.user-menu-item:hover{background:var(--card2);}
.user-menu-item.danger{color:var(--red);}

/* ── PROGRESS ── */
.progress{display:flex;gap:8px;margin-bottom:20px;}
.progress-pip{flex:1;height:6px;border-radius:999px;background:#202820;overflow:hidden;position:relative;}
.progress-pip.active::after{content:'';position:absolute;inset:0;background:var(--accent);animation:pulse 1.4s infinite;}
.progress-pip.correct{background:var(--green);}
.progress-pip.wrong{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── VIDEO ── */
.video-wrap{
  position:relative;width:100%;aspect-ratio:16/9;
  overflow:hidden;border-radius:20px;background:#000;
  border:1px solid #1f271f;box-shadow:0 20px 80px rgba(0,0,0,.55);
}

video{
  width:100%;height:100%;object-fit:contain;background:#000;display:block;
  opacity:0;transition:opacity .35s ease;
}
video.ready{opacity:1;}

.video-top{
  position:absolute;top:0;left:0;right:0;padding:14px;
  background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);z-index:2;
}
.clip-label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#ffffffcc;font-family:'Barlow Condensed',sans-serif;font-weight:700;}

/* ── INFO ── */
.clip-info{margin:18px 0 4px;}
.clip-number{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.clip-title{font-size:24px;font-weight:700;line-height:1.15;}

.hint{
  text-align:center;font-size:12px;letter-spacing:3px;text-transform:uppercase;
  color:#9ca3af;margin:14px 0;min-height:18px;
}

/* ── ANSWERS ── */
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}

.answer{
  position:relative;padding:22px 14px;border-radius:18px;
  border:1px solid #2d3a2c;
  background:linear-gradient(to bottom,#1b241a,#141a13);
  display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;
  transition:transform .15s,border-color .2s,background .2s,opacity .2s;
}

.answer:hover:not(:disabled):not(.locked){transform:translateY(-3px);border-color:#84cc16;background:linear-gradient(to bottom,#212b1f,#171d16);}
.answer:disabled{cursor:not-allowed;}
.answer.locked{opacity:.35;cursor:not-allowed;pointer-events:none;}

.answer.correct-selected{border-color:var(--green)!important;background:#14532d!important;}
.answer.wrong-selected{border-color:var(--red)!important;background:#450a0a!important;}
.answer.reveal{border-color:var(--green)!important;background:#14532d55!important;}
.answer.dimmed{opacity:.3;}

.answer-icon{font-size:30px;}
.answer-label{font-family:'Bebas Neue',cursive;letter-spacing:1.5px;font-size:18px;}
.answer.none .answer-label{color:var(--green);}
.answer.freekick .answer-label{color:var(--blue);}
.answer.yellow .answer-label{color:var(--yellow);}
.answer.red .answer-label{color:var(--red);}

/* ── RESULT ── */
.result{
  display:none;margin-top:16px;background:var(--card);
  border:1px solid var(--border);border-radius:18px;
  padding:18px;animation:up .25s ease;
}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.result-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.result-title{font-family:'Bebas Neue',cursive;letter-spacing:2px;font-size:24px;}
.result-title.correct{color:var(--green);}
.result-title.wrong{color:var(--red);}
.result-tag{margin-left:auto;padding:4px 8px;border-radius:6px;background:#ffffff12;font-size:12px;letter-spacing:1px;font-weight:700;}
.result-text{color:#a8b5a7;line-height:1.7;font-size:14px;}

/* ── NEXT ── */
.next{
  width:100%;margin-top:16px;padding:16px;border:none;
  border-radius:18px;background:var(--accent);color:#0a0f0a;
  font-family:'Bebas Neue',cursive;font-size:22px;letter-spacing:3px;
  cursor:pointer;display:none;transition:transform .15s;
}
.next:hover{transform:translateY(-2px);}
.next.visible{display:block;}

/* ── DONE ── */
.done{display:none;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:40px;}
.done.visible{display:flex;}
.done-emoji{font-size:70px;}
.done-title{font-family:'Bebas Neue',cursive;font-size:54px;letter-spacing:4px;}
.done-score{font-size:18px;color:var(--muted);}
.done-score strong{color:var(--text);font-size:34px;}
.score-row{display:flex;gap:10px;}
.score-box{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.score-box.correct{background:#14532d;border:1px solid var(--green);}
.score-box.wrong{background:#450a0a;border:1px solid var(--red);}

.countdown-box{width:100%;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;}
.countdown-label{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.countdown{font-family:'Bebas Neue',cursive;font-size:42px;letter-spacing:4px;}

.btn-row{display:flex;flex-direction:column;gap:10px;width:100%;}
.share{width:100%;padding:16px;border-radius:18px;border:none;background:var(--accent);color:#0a0f0a;cursor:pointer;font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:3px;}
.share:hover{background:#b5f040;}

/* ── NO CLIPS ── */
.no-clips{margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;text-align:center;}
.no-clips h2{font-family:'Bebas Neue',cursive;letter-spacing:2px;font-size:34px;margin-bottom:10px;}
.no-clips p{color:var(--muted);line-height:1.7;}
.no-clips code{display:inline-block;margin-top:12px;background:#0d130d;border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-family:monospace;font-size:13px;color:var(--accent);text-align:left;line-height:2;}

/* ── TOAST ── */
.toast{
  position:fixed;left:50%;bottom:28px;
  transform:translateX(-50%) translateY(16px);
  background:var(--accent);color:#0a0f0a;
  padding:10px 20px;border-radius:10px;
  font-size:13px;letter-spacing:2px;font-weight:700;
  opacity:0;transition:.3s ease;pointer-events:none;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

</head>

    let found = false;
    for (const c of ['n','f','y','r']) {
      const filename = `${code}-${i}-${c}.mp4`;
      if (await fileExists(filename)) {
        const key  = `${code}-${i}`;
        const meta = CLIP_META[key] || {};
        clips.push({
          filename,
          correct:     ANSWER_MAP[c],
          title:       meta.title       || `Incident ${i}`,
          explanation: meta.explanation || DEFAULT_EXPLANATIONS[ANSWER_MAP[c]]
        });
        found = true;
        break;
      }
    }
    if (!found && i > clips.length) break;
  }
  return clips;
}

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════

const TODAY_CODE = todayCode();
const TODAY_ISO  = todayISO();

let clips    = [];
let answered = false;
let currentUser = null;

// Per-user state stored in Firestore
let userState  = { clipIndex:0, answers:[], done:false, date:TODAY_ISO };
let userStreak = { count:0, lastDate:null };

// ── Firestore helpers ──
async function loadUserData(uid) {
  const ref  = doc(db, 'users', uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const data = snap.data();
    if (data.streak) userStreak = data.streak;
    if (data.gameState && data.gameState.date === TODAY_ISO) {
      userState = data.gameState;
    }
  }
}

async function saveUserData(uid) {
  const ref = doc(db, 'users', uid);
  await setDoc(ref, {
    streak:    userStreak,
    gameState: userState,
    updatedAt: serverTimestamp()
  }, { merge: true });
}

// ══════════════════════════════════════════════
//  AUTH UI
// ══════════════════════════════════════════════

let isRegisterMode = false;

window.toggleAuthMode = () => {
  isRegisterMode = !isRegisterMode;
  document.getElementById('authTitle').textContent    = isRegisterMode ? 'CREATE ACCOUNT' : 'SIGN IN';
  document.getElementById('authSubmit').textContent   = isRegisterMode ? 'CREATE ACCOUNT' : 'SIGN IN';
  document.getElementById('nameGroup').style.display  = isRegisterMode ? 'flex' : 'none';
  document.getElementById('authToggle').innerHTML     = isRegisterMode
    ? 'Have an account? <a onclick="toggleAuthMode()">Sign in</a>'
    : 'No account? <a onclick="toggleAuthMode()">Create one</a>';
  clearAuthError();
};

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
}

function clearAuthError() {
  document.getElementById('authError').classList.remove('show');
}

// Friendly Firebase error messages
function friendlyError(code) {
  switch(code) {
    case 'auth/invalid-email':            return 'Invalid email address.';
    case 'auth/user-not-found':           return 'No account found with this email.';
    case 'auth/wrong-password':           return 'Incorrect password.';
    case 'auth/email-already-in-use':     return 'An account already exists with this email.';
    case 'auth/weak-password':            return 'Password must be at least 6 characters.';
    case 'auth/popup-closed-by-user':     return 'Sign-in cancelled.';
    case 'auth/network-request-failed':   return 'Network error. Check your connection.';
    case 'auth/invalid-credential':       return 'Incorrect email or password.';
    default: return 'Something went wrong. Please try again.';
  }
}

window.handleEmailAuth = async () => {
  clearAuthError();
  const email    = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name     = document.getElementById('authName').value.trim();
  const btn      = document.getElementById('authSubmit');

  if (!email || !password) { showAuthError('Please enter your email and password.'); return; }

  btn.disabled = true;
  btn.textContent = '…';

  try {
    if (isRegisterMode) {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if (name) await updateProfile(cred.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch(e) {
    showAuthError(friendlyError(e.code));
    btn.disabled = false;
    btn.textContent = isRegisterMode ? 'CREATE ACCOUNT' : 'SIGN IN';
  }
};

window.handleGoogleAuth = async () => {
  clearAuthError();
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') {
      showAuthError(friendlyError(e.code));
    }
  }
};

window.signOut = async () => {
  await fbSignOut(auth);
};

// Enter key on auth inputs
['authEmail','authPassword','authName'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') window.handleEmailAuth();
  });
});

// ══════════════════════════════════════════════
//  GAME ENGINE
// ══════════════════════════════════════════════

function buildProgress() {
  const row = document.getElementById('progress');
  row.innerHTML = '';
  clips.forEach((_,i) => {
    const el = document.createElement('div');
    el.className = 'progress-pip';
    if      (i < userState.answers.length) el.classList.add(userState.answers[i].correct ? 'correct' : 'wrong');
    else if (i === userState.clipIndex)    el.classList.add('active');
    row.appendChild(el);
  });
}

function loadClip(index) {
  answered = false;
  const clip  = clips[index];
  const video = document.getElementById('video');

  video.classList.remove('ready');
  document.getElementById('clipLabel').textContent  = `Clip ${index+1} of ${clips.length}`;
  document.getElementById('clipNumber').textContent = `Incident ${index+1}`;
  document.getElementById('clipTitle').textContent  = clip.title;
  document.getElementById('hint').textContent       = 'Watch the clip';
  document.getElementById('result').style.display   = 'none';
  document.getElementById('nextButton').classList.remove('visible');

  document.querySelectorAll('.answer').forEach(btn => {
    btn.classList.add('locked');
    btn.disabled = false;
    btn.classList.remove('correct-selected','wrong-selected','reveal','dimmed');
  });

  buildProgress();

  video.src = clip.filename;
  video.load();
  video.oncanplay = () => video.classList.add('ready');

  video.onended = () => {
    if (answered) return;
    document.querySelectorAll('.answer').forEach(b => b.classList.remove('locked'));
    document.getElementById('hint').textContent = 'Choose your decision';
  };

  video.play().catch(() => {
    document.getElementById('hint').textContent = 'Tap play to watch';
  });

  // Preload next clip
  const next = clips[index+1];
  if (next) {
    const link = document.createElement('link');
    link.rel = 'preload'; link.as = 'video'; link.href = next.filename;
    document.head.appendChild(link);
  }
}

function submitAnswer(choice) {
  const btn = document.querySelector(`[data-answer="${choice}"]`);
  if (!btn || btn.classList.contains('locked') || answered) return;
  answered = true;

  const clip    = clips[userState.clipIndex];
  const correct = choice === clip.correct;

  userState.answers.push({ chosen:choice, correct });
  saveUserData(currentUser.uid);

  document.querySelectorAll('.answer').forEach(el => {
    el.disabled = true;
    const id = el.dataset.answer;
    if      (id === choice && correct)  el.classList.add('correct-selected');
    else if (id === choice && !correct) el.classList.add('wrong-selected');
    else if (id === clip.correct)       el.classList.add('reveal');
    else                                el.classList.add('dimmed');
  });

  buildProgress();

  const result = document.getElementById('result');
  result.style.display = 'block';
  result.innerHTML = `
    <div class="result-top">
      <div style="font-size:22px">${correct ? '✅' : '❌'}</div>
      <div class="result-title ${correct ? 'correct' : 'wrong'}">${correct ? 'Correct' : 'Wrong Call'}</div>
      <div class="result-tag">${ANSWER_LABELS[clip.correct]}</div>
    </div>
    <div class="result-text">${clip.explanation}</div>
  `;

  const nb = document.getElementById('nextButton');
  nb.classList.add('visible');
  nb.textContent = userState.clipIndex >= clips.length - 1 ? 'SEE RESULTS →' : 'NEXT →';
}

function nextClip() {
  if (userState.clipIndex >= clips.length - 1) { finishGame(); return; }
  userState.clipIndex++;
  loadClip(userState.clipIndex);
}

function finishGame() {
  userState.done = true;

  const yesterday = new Date(Date.now()-86400000).toISOString().split('T')[0];
  if      (userStreak.lastDate === yesterday)    userStreak.count++;
  else if (userStreak.lastDate !== TODAY_ISO)    userStreak.count = 1;
  userStreak.lastDate = TODAY_ISO;

  saveUserData(currentUser.uid);

  document.getElementById('streakCount').textContent = userStreak.count;
  document.getElementById('game').style.display = 'none';
  document.getElementById('done').classList.add('visible');

  const score = userState.answers.filter(a=>a.correct).length;
  document.getElementById('finalScore').textContent = `${score}/${clips.length}`;
  document.getElementById('doneEmoji').textContent  = score===clips.length?'🏆':score>=2?'👏':score===1?'😬':'💀';
  document.getElementById('scoreRow').innerHTML = userState.answers.map(a=>
    `<div class="score-box ${a.correct?'correct':'wrong'}">${a.correct?'✅':'❌'}</div>`
  ).join('');

  startCountdown();
}

window.shareResult = () => {
  const score = userState.answers.filter(a=>a.correct).length;
  const pips  = userState.answers.map(a=>a.correct?'🟩':'🟥').join('');
  const text  = `THE REF ${TODAY_ISO}\n${pips}\n${score}/${clips.length}\n🔥 ${userStreak.count} day streak`;
  navigator.clipboard.writeText(text).then(()=>{
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  });
};

function startCountdown() {
  const tick = () => {
    const now = new Date(), mn = new Date(now); mn.setHours(24,0,0,0);
    const d = mn-now;
    document.getElementById('countdown').textContent = [
      Math.floor(d/3600000),Math.floor(d%3600000/60000),Math.floor(d%60000/1000)
    ].map(n=>String(n).padStart(2,'0')).join(':');
  };
  tick(); setInterval(tick,1000);
}

// ── User menu ──
window.toggleUserMenu = () => {
  document.getElementById('userMenu').classList.toggle('show');
};

// ══════════════════════════════════════════════
//  ANSWER BUTTON LISTENERS
// ══════════════════════════════════════════════
document.querySelectorAll('.answer').forEach(btn => {
  btn.addEventListener('click', () => submitAnswer(btn.dataset.answer));
});
document.getElementById('nextButton').addEventListener('click', nextClip);

// ══════════════════════════════════════════════
//  AUTH STATE OBSERVER — main entry point
// ══════════════════════════════════════════════
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    // Show auth screen
    document.getElementById('authScreen').style.display   = 'flex';
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('appScreen').style.display    = 'none';
    return;
  }

  // User signed in — show loading
  currentUser = user;
  document.getElementById('authScreen').style.display    = 'none';
  document.getElementById('loadingScreen').classList.add('show');
  document.getElementById('appScreen').style.display     = 'none';

  // Load user data from Firestore
  await loadUserData(user.uid);

  // Set user menu info
  document.getElementById('userMenuEmail').textContent =
    user.displayName ? `${user.displayName}\n${user.email}` : user.email;
  document.getElementById('streakCount').textContent = userStreak.count;

  // Load today's clips
  clips = await buildClips(TODAY_CODE);

  // Hide loading, show app
  document.getElementById('loadingScreen').classList.remove('show');
  document.getElementById('appScreen').style.display = 'block';

  if (!clips.length) {
    document.getElementById('game').innerHTML = `
      <div class="no-clips">
        <h2>No clips today</h2>
        <p>Add your MP4 files to the repo.<br>Today's code: <strong style="color:var(--accent)">${TODAY_CODE}</strong><br><br>
        <code>${TODAY_CODE}-1-r.mp4<br>${TODAY_CODE}-2-y.mp4<br>${TODAY_CODE}-3-f.mp4</code></p>
      </div>
    `;
    return;
  }

  if (userState.done) {
    // Already played today
    const score = userState.answers.filter(a=>a.correct).length;
    document.getElementById('game').style.display = 'none';
    document.getElementById('done').classList.add('visible');
    document.getElementById('finalScore').textContent = `${score}/${userState.answers.length}`;
    document.getElementById('doneEmoji').textContent  = score===clips.length?'🏆':score>=2?'👏':score===1?'😬':'💀';
    document.getElementById('scoreRow').innerHTML = userState.answers.map(a=>
      `<div class="score-box ${a.correct?'correct':'wrong'}">${a.correct?'✅':'❌'}</div>`
    ).join('');
    startCountdown();
    return;
  }

  if (userState.clipIndex >= clips.length) userState.clipIndex = 0;
  buildProgress();
  loadClip(userState.clipIndex);
});

</script>
